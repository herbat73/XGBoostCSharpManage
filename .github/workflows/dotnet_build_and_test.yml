# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Build and Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release /p:CI=true --no-restore
      - name: Test
        run: dotnet test tests/XGBoost.Managed.Tests/XGBoost.Managed.Tests.csproj -c Release --logger trx --logger GitHubActions --results-directory ./test-results/ /p:CI=true
      - name: .NET Test Results
        uses: dorny/test-reporter@v2
        continue-on-error: true
        if: success() || failure()
        with:
          name: .NET Test Results
          path: 'test-results/*.trx'
          reporter: dotnet-trx